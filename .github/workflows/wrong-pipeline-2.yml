runner: jenkins-jenkins-agent

trigger:
  push:
    branches:
      - main
      - develop
  schedule:
    cron: "every day at 9am"    # ❌ invalid cron expression — must follow "* * * * *" format

inputs:
  appVersion:
    description: App version to build
    required: true
    type: string
  platform:
    description: Target platform
    required: false
    type: choice
    default: android
    options:
      - android
      - ios
      - android                 # ❌ duplicate option value

stages:
  - name: Checkout
    steps:
      - gitCheckout:

  - name: Setup Environment
    steps:
      - sh: |
          echo "Setting up build environment..."
          echo "Platform: $inputs.platform"

  - name: Install Dependencies
    steps:
      - sh: |
          echo "Installing dependencies..."
          npm install

  - name: Build                 # ❌ duplicate stage name — "Build" appears twice
    steps:
      - sh: |
          echo "Compiling sources..."

  - name: Test
    parallel: true
    blocks:
      - name: Unit Tests
        steps:
          - sh: echo "Running unit tests..."

      - name: Unit Tests        # ❌ duplicate block name within parallel

        steps:
          - sh: echo "Running more unit tests..."

      - name: UI Tests
        steps:
          - sh: echo "Running UI tests..."
        timeout: "10 minutes"   # ❌ wrong type — timeout must be a number (seconds), not a string

  - name: Build                 # ❌ duplicate stage name — second "Build" stage
    steps:
      - buildPushImage:
          imageName: mobile-app:$inputs.appVersion
          registry: $config.lib.DOCKER_PULL_REGISTRY
          credentials: $config.lib.DOCKER_PUSH_CRED_ID
          extraTags:
            - latest
            - $inputs.platform
          push: true
          cache: enabled        # ❌ wrong type — cache must be boolean true/false

  - name: Deploy
    depends_on:                 # ❌ unknown field — "depends_on" is not supported
      - Build
      - Test
    steps:
      - sh: |
          echo "Deploying mobile backend..."
          kubectl apply -f k8s/

finally:
  - sh: |
      echo "Pipeline finished."
