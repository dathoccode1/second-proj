runner: jenkins-jenkins-agent

inputs:
  hotfixBranch:
    description: 'Hotfix branch name (e.g. hotfix/fix-login-crash)'
    required: true
    type: string
  ticketId:
    description: 'Issue/ticket ID related to this hotfix'
    required: true
    type: string
  deployTarget:
    description: 'Environment to deploy the hotfix'
    required: false
    type: choice
    default: 'production'
    options:
      - staging
      - production
  debug:
    description: 'Enable debug mode'
    required: false
    type: boolean
    default: false

trigger:
  push:
    branches:
      - hotfix/*
  merge_request:
    target_branches:
      - main
    actions:
      - open
      - reopen
      - comment: [recheck, "approve hotfix"]

stages:
  - name: Checkout
    steps:
      - gitCheckout:

  - name: Validate Hotfix
    steps:
      - setEnv:
          TICKET_ID: $inputs.ticketId
          HOTFIX_BRANCH: $inputs.hotfixBranch
      - sh: |
          echo "Validating hotfix for ticket $TICKET_ID on branch $HOTFIX_BRANCH..."
          git log --oneline -5

  - name: Build
    steps:
      - sh: |
          echo "Fast build for hotfix..."
          ./gradlew clean build -x test

  - name: Critical Tests
    parallel: true
    blocks:
      - name: Unit Tests
        steps:
          - sh: |
              echo "Running critical unit tests..."
              ./gradlew test --tests "*Critical*" --tests "*Hotfix*"

      - name: Regression Tests
        steps:
          - sh: |
              echo "Running regression suite..."
              ./gradlew integrationTest -Dgroups=regression,smoke

  - name: Build & Push Hotfix Image
    steps:
      - buildPushImage:
          imageName: my-app:hotfix-$inputs.ticketId
          registry: $config.lib.DOCKER_PULL_REGISTRY
          credentials: $config.lib.DOCKER_PUSH_CRED_ID

  - name: Deploy Hotfix
    container:
      image: rancher/kubectl
      options: -e ENV=$inputs.deployTarget -e HOTFIX=true
    steps:
      - sh: |
          echo "Applying hotfix to $deployTarget..."
          kubectl set image deployment/my-app app=my-app:hotfix-$TICKET_ID
          kubectl rollout status deployment/my-app --timeout=180s

  - name: Verify Fix
    steps:
      - sh: |
          echo "Verifying hotfix is live..."
          kubectl get pods -l app=my-app
          echo "Hotfix $TICKET_ID deployed successfully."

finally:
  - commentPipelineResult:
      netchatGroupID: $config.lib.NETCHAT_GROUP_ID
      onSuccess: ":white_check_mark: Hotfix [$inputs.ticketId] deployed to $inputs.deployTarget ([pipeline]($RUN_DISPLAY_URL))"
      onFail: ":sos: Hotfix [$inputs.ticketId] FAILED on $inputs.deployTarget ([pipeline]($RUN_DISPLAY_URL)) $FAIL_MESSAGE"
      onAbort: ":warning: Hotfix [$inputs.ticketId] was canceled ([pipeline]($RUN_DISPLAY_URL))"
  - sh: |
      echo "Hotfix pipeline complete. Cleaning workspace..."
      rm -rf build/ .gradle/
