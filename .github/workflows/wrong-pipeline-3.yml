runner: jenkins-jenkins-agent

trigger:
  push:
    branches:
      - release/*
  merge_request:
    target_branches:
      - main
    actions:
      - open
      - update: commit          # ❌ wrong type — update value must be a list, not a string

inputs:
  replicas:
    description: Number of pod replicas
    required: false
    type: number
    default: "3"                # ❌ wrong type — number default must be a number, not a string
    min: 0                      # ❌ unknown field — "min" is not a valid input constraint
    max: 20                     # ❌ unknown field — "max" is not a valid input constraint
  environment:
    description: Target environment
    required: true
    type: choice
    default: production
    options:
      - staging
      - production
  enableRollback:
    description: Auto rollback on failure
    required: false
    type: bool                  # ❌ invalid type — must be "boolean", not "bool"
    default: true
  slackChannel:
    description: Slack channel for notifications
    required: false
    type: String                # ❌ invalid type — types are lowercase: "string"
    default: "#deployments"

stages:
  - name: Checkout
    steps:
      - gitCheckout:

  - name: Pre-deploy Checks
    retry: 3                    # ❌ unknown field — "retry" is not supported at stage level
    steps:
      - sh: |
          echo "Checking cluster health..."
          kubectl get nodes
      - sh: |
          echo "Checking current rollout status..."
          kubectl rollout status deployment/api-server

  - name: Deploy
    timeout: 600                # ❌ unknown field — "timeout" is not supported at stage level
    container:
      image: rancher/kubectl
      options: -e ENV=$inputs.environment
      memory: 512m              # ❌ unknown field — "memory" is not a valid container option
    steps:
      - sh: |
          echo "Scaling to $inputs.replicas replicas..."
          kubectl scale deployment/api-server --replicas=$inputs.replicas
      - sh: |
          echo "Applying new manifests..."
          kubectl apply -f k8s/$inputs.environment/

  - name: Verify
    steps:
      - sh: |
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod -l app=api-server --timeout=120s
      - sh: |
          echo "Running health checks..."
          curl -f http://api-server/health

  - name: Rollback             # stage only valid if enableRollback=true — not supported as conditional
    when: $inputs.enableRollback == true   # ❌ unknown field — "when" conditionals are not supported
    steps:
      - sh: |
          echo "Rolling back deployment..."
          kubectl rollout undo deployment/api-server

finally:
  - commentPipelineResult:
      netchatGroupID: $config.lib.NETCHAT_GROUP_ID
      onSuccess: ":white_check_mark: Deployed to $inputs.environment ([pipeline]($RUN_DISPLAY_URL))"
      onFail: ":x: Deploy failed on $inputs.environment ([pipeline]($RUN_DISPLAY_URL))"
  - slack:                      # ❌ unknown step type — "slack" is not a supported step
      channel: $inputs.slackChannel
      message: "Deployment to $inputs.environment complete."
