runner: jenkins-jenkins-agent
xxxvv
trigger:
  push:
    branchs:                    # ❌ typo — unknown field, should be "branches"
      - main
      - develop
  merge_request:
    target_branches: main       # ❌ wrong type — must be a list, not a string
    actions:
      - open
      - comment: recheck        # ❌ wrong type — comment value must be a list

inputs:
  environment:
    description: Target deploy environment
    required: true
    type: choice
    options: staging, production  # ❌ wrong type — must be a YAML list, not a string
  dryRun:
    description: Run without applying changes
    type: boolean
    default: "false"              # ❌ wrong type — boolean default must be true/false, not a string

stages:
  - name: Checkout
    step:                         # ❌ unknown field — should be "steps"
      - gitCheckout:

  - name: Set Version
    steps:
      - setEnv                    # ❌ missing colon — should be "setEnv:"
          APP_VERSION: 1.5.0
          DEPLOY_ENV: $inputs.environment

  - name: Build
    steps:
      - sh |                      # ❌ missing colon — should be "sh: |"
          echo "Building application v$APP_VERSION..."
          ./gradlew clean build -x test

  - name: Test
    parallel: yes                 # ❌ wrong type — must be boolean true, not string "yes"
    blocks:
      name: Unit Tests            # ❌ missing list marker — should be "- name:"
      steps:
        - sh: ./gradlew test

      - name: Integration Tests
        steps:
          sh: ./gradlew integrationTest   # ❌ missing list marker — should be "- sh:"

  - name: Build Image
    steps:
      - buildPushImage:
          imageName:              # ❌ missing value — required field cannot be empty
          registry: registry.internal
          credentials: $config.lib.DOCKER_PUSH_CRED_ID

  - name: Deploy
    container
      image: rancher/kubectl     # ❌ missing colon after "container"
      options: -e ENV=$inputs.environment
    steps:
      - sh: |
          kubectl set image deployment/my-app app=my-app:$APP_VERSION
          kubectl rollout status deployment/my-app --timeout=300s

  - name: Notify
    steps:
      - commentPipelineResult
          netchatGroupID: $config.lib.NETCHAT_GROUP_ID   # ❌ missing colon after step name
          onSuccess: ":rocket: v$APP_VERSION deployed successfully"
          onFail: ":x: Deployment failed — $FAIL_MESSAGE"

finally
  - sh: |                        # ❌ missing colon after "finally"
      echo "Pipeline complete."
      rm -rf build/ .gradle/
